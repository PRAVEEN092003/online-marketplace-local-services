{% extends "base.html" %}

{% block title %}Register - Online Marketplace{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted small">Join our community as a customer or freelancer</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label fw-semibold">Select Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="" disabled selected>-- Choose your account type --</option>
                                <option value="customer">Customer (Looking to hire services)</option>
                                <option value="freelancer">Freelancer (Offering services)</option>
                            </select>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">Register</button>
                        </div>

                        <div class="text-center text-muted small">
                            Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Log In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
